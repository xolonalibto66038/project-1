{% load static %}
{% if LANGUAGE_BIDI %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Tajawal:wght@300;400;500;700&display=swap"
        rel="stylesheet">
{% else %}
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
{% endif %}
<link rel="stylesheet"
      href="{% static 'plugins/fontawesome-free/css/all.min.css' %}">
<!-- Select2 -->
<link rel="stylesheet"
      href="{% static 'plugins/select2/css/select2.min.css' %}">
<link rel="stylesheet"
      href="{% static 'plugins/select2-bootstrap4-theme/select2-bootstrap4.min.css' %}">
<!-- Toastr -->
<link rel="stylesheet" href="{% static 'plugins/toastr/toastr.min.css' %}">
{% if LANGUAGE_BIDI %}
  <link rel="stylesheet" href="{% static 'dist/css/adminlte.rtl.min.css' %}">
  {% comment %} <link rel="stylesheet" href="{% static 'dist/css/rtl-fixes.css' %}"> {% endcomment %}
{% else %}
  <link rel="stylesheet" href="{% static 'dist/css/adminlte.min.css' %}">
{% endif %}
